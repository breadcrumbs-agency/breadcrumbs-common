[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breadcrumbs-common"
version = "0.4.1"
description = "Content-addressed breadcrumb memory: the store, the verbs, the servers (MCP, socket, A2A) and the command line."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["google-crc32c>=1.5,<2; platform_python_implementation == 'CPython'"]

[project.scripts]
breadcrumbs = "breadcrumbs.cli:main"

[tool.setuptools]
packages = ["breadcrumbs"]

[tool.setuptools.package-data]
breadcrumbs = ["*.sh"]
